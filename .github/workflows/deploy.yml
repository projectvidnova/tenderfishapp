name: Deploy Application

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/terraform/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ─── Stage 1: Lint & Type Check ─────────────────
  check:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx turbo lint --filter=@tenderfish/api --filter=@tenderfish/web
      - run: npx turbo build --filter=@tenderfish/db --filter=@tenderfish/shared
        # Build shared packages first so type-check can resolve them

  # ─── Stage 2: Build & Push Docker Images ────────
  build:
    name: Build Images
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ─── Stage 3: Deploy to IONOS VPS ──────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Sync config files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          key: ${{ secrets.IONOS_SSH_KEY }}
          source: "docker-compose.production.yml,infra/Caddyfile"
          target: /opt/tenderfish
          overwrite: true

      - name: Generate .env on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          key: ${{ secrets.IONOS_SSH_KEY }}
          script: |
            set -e
            cat > /opt/tenderfish/.env << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=redis://localhost:6379
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
            MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}
            GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
            AI_PROVIDER=${{ vars.AI_PROVIDER || 'ionos' }}
            IONOS_API_KEY=${{ secrets.IONOS_API_KEY }}
            IONOS_AI_BASE_URL=${{ vars.IONOS_AI_BASE_URL || 'https://openai.inference.de-txl.ionos.com/v1' }}
            IONOS_AI_MODEL=${{ vars.IONOS_AI_MODEL || 'meta-llama/Meta-Llama-3.1-8B-Instruct' }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_MODEL=${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}
            POSTMARK_API_KEY=${{ secrets.POSTMARK_API_KEY }}
            POSTMARK_INBOUND_HASH=${{ secrets.POSTMARK_INBOUND_HASH }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT || 'https://s3.eu-central-1.ionoscloud.com' }}
            S3_REGION=${{ vars.S3_REGION || 'de' }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_BUCKET_NAME=${{ vars.S3_BUCKET_NAME || 'tenderfish-dev-files' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NODE_ENV=production
            PORT=3001
            HOST=0.0.0.0
            LOG_LEVEL=info
            RATE_LIMIT_MAX=100
            RATE_LIMIT_WINDOW=1 minute
            AUTH_RATE_LIMIT_MAX=10
            AUTH_RATE_LIMIT_WINDOW=15 minutes
            MAX_FILE_SIZE_BYTES=52428800
            CORS_MAX_AGE_SECONDS=86400
            SIGNED_URL_EXPIRY_MS=900000
            AI_MAX_TOKENS_EXTRACT=4096
            AI_MAX_TOKENS_CLASSIFY=2048
            AI_MAX_TOKENS_CHAT=1024
            AI_FACT_EXTRACTION_MAX_CHARS=100000
            AI_CLASSIFICATION_MAX_CHARS=50000
            CHAT_HISTORY_LIMIT=10
            DEFAULT_COUNTRY=Germany
            ENVEOF
            chmod 600 /opt/tenderfish/.env
            echo ".env generated successfully"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IONOS_HOST }}
          username: ${{ secrets.IONOS_USER }}
          key: ${{ secrets.IONOS_SSH_KEY }}
          envs: IMAGE_PREFIX
          script: |
            set -e
            cd /opt/tenderfish

            # Authenticate with GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker pull ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}

            # Tag as latest locally
            docker tag ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }} ${{ env.IMAGE_PREFIX }}/api:latest
            docker tag ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }} ${{ env.IMAGE_PREFIX }}/web:latest

            # Run DB migration BEFORE restarting the API
            echo "Running DB migrations..."
            docker run --rm \
              --env-file /opt/tenderfish/.env \
              --network host \
              -w /app/packages/db \
              ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }} \
              npx drizzle-kit push --force
            echo "DB migrations complete"

            # Rolling restart (zero-downtime for Caddy)
            docker compose -f docker-compose.production.yml up -d --no-build --force-recreate api web

            # Wait for API health
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "API healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "API health check failed!"
                docker compose -f docker-compose.production.yml logs --tail=50 api
                exit 1
              fi
              sleep 1
            done

  # ─── Stage 5: Smoke Test ───────────────────────
  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify endpoints
        run: |
          echo "Testing health..."
          curl -sf "${{ vars.NEXT_PUBLIC_API_URL }}/health" || exit 1

          echo "Testing web..."
          STATUS=$(curl -so /dev/null -w '%{http_code}' "${{ vars.NEXT_PUBLIC_APP_URL }}")
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 307 ]; then
            echo "Web returned $STATUS"
            exit 1
          fi

          echo "All smoke tests passed."

      - name: Summary
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** ${{ vars.NEXT_PUBLIC_API_URL }}/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Web:** ${{ vars.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_STEP_SUMMARY
