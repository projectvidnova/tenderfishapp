# Cloud Build CI/CD Pipeline — App Engine (no Docker)
# Triggered on push to main (production) or staging branch
# Steps: install → typecheck → migrate → build web → deploy

substitutions:
  _PROJECT_ID: tenderfish-prod

steps:
  # ─── 1. Install dependencies ──────────────────────────────

  - name: node:20-alpine
    id: install
    entrypoint: npm
    args: ["ci"]

  # ─── 2. TypeScript checks (parallel) ──────────────────────

  - name: node:20-alpine
    id: typecheck-api
    entrypoint: npx
    args: ["tsc", "--noEmit", "-p", "apps/api/tsconfig.json"]
    waitFor: ["install"]

  - name: node:20-alpine
    id: typecheck-web
    entrypoint: npx
    args: ["tsc", "--noEmit", "-p", "apps/web/tsconfig.json"]
    waitFor: ["install"]

  # ─── 3. Run database migrations ────────────────────────────

  - name: node:20-alpine
    id: migrate
    entrypoint: npx
    args: ["drizzle-kit", "push", "--force"]
    dir: packages/db
    secretEnv: ["DATABASE_URL"]
    waitFor: ["typecheck-api"]

  # ─── 4. Build Next.js ─────────────────────────────────────

  - name: node:20-alpine
    id: build-web
    entrypoint: npm
    args: ["run", "build"]
    dir: apps/web
    secretEnv:
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      - NEXT_PUBLIC_API_URL
    waitFor: ["typecheck-web"]

  # ─── 5. Deploy API to App Engine ──────────────────────────

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-api
    args:
      - app
      - deploy
      - apps/api/app.yaml
      - --quiet
      - --project=${_PROJECT_ID}
    waitFor: ["migrate"]

  # ─── 6. Deploy Web to App Engine ──────────────────────────

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-web
    args:
      - app
      - deploy
      - apps/web/app.yaml
      - --quiet
      - --project=${_PROJECT_ID}
    waitFor: ["build-web", "deploy-api"]

  # ─── 7. Deploy cron schedule ──────────────────────────────

  - name: gcr.io/cloud-builders/gcloud
    id: deploy-cron
    args:
      - app
      - deploy
      - cron.yaml
      - --quiet
      - --project=${_PROJECT_ID}
    waitFor: ["deploy-api"]

availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/DATABASE_URL/versions/latest
      env: DATABASE_URL
    - versionName: projects/${_PROJECT_ID}/secrets/NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY/versions/latest
      env: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    - versionName: projects/${_PROJECT_ID}/secrets/NEXT_PUBLIC_API_URL/versions/latest
      env: NEXT_PUBLIC_API_URL

timeout: 900s

options:
  logging: CLOUD_LOGGING_ONLY
