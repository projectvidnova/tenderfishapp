# Production Docker Compose for IONOS VPS deployment
# Images are pre-built and pushed to GHCR by CI/CD pipeline
# Usage: docker compose -f docker-compose.production.yml up -d

services:
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/projectvidnova/tenderfishapp}/api:latest
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/projectvidnova/tenderfishapp}/web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3002
    ports:
      - "127.0.0.1:3002:3002"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  redis_data:
  caddy_data:
  caddy_config:
