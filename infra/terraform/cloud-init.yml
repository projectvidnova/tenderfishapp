#cloud-config
# Cloud-init for TenderFish VPS — runs on first boot automatically

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw

# Create app user
users:
  - name: tenderfish
    groups: docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

# Install Docker + set up app directory
runcmd:
  # Docker GPG key
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  # Docker repo
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  # Enable Docker
  - systemctl enable docker
  - systemctl start docker
  # App directory
  - mkdir -p /opt/${project_name}
  - chown tenderfish:tenderfish /opt/${project_name}
  # Firewall
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  # Create the Caddyfile
  - mkdir -p /opt/${project_name}/infra
  - |
    cat > /opt/${project_name}/infra/Caddyfile << 'CADDYEOF'
    :80 {
      handle /api/* {
        reverse_proxy host.docker.internal:3001
      }
      handle {
        reverse_proxy web:3002
      }
      header {
        X-Content-Type-Options nosniff
        X-Frame-Options DENY
        Referrer-Policy strict-origin-when-cross-origin
      }
    }
    CADDYEOF
  - chown -R tenderfish:tenderfish /opt/${project_name}
  # Create docker-compose.production.yml
  - |
    cat > /opt/${project_name}/docker-compose.production.yml << 'COMPOSEEOF'
    services:
      api:
        image: ghcr.io/${github_repo}/api:latest
        restart: unless-stopped
        network_mode: host
        env_file: .env
        depends_on:
          redis:
            condition: service_healthy
        healthcheck:
          test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
          interval: 30s
          timeout: 5s
          retries: 3
      web:
        image: ghcr.io/${github_repo}/web:latest
        restart: unless-stopped
        env_file: .env
        environment:
          - PORT=3002
        ports:
          - "127.0.0.1:3002:3002"
      redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
          - "127.0.0.1:6379:6379"
        volumes:
          - redis_data:/data
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 10s
          timeout: 5s
          retries: 5
      caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
          - "80:80"
          - "443:443"
        extra_hosts:
          - "host.docker.internal:host-gateway"
        volumes:
          - ./infra/Caddyfile:/etc/caddy/Caddyfile
          - caddy_data:/data
          - caddy_config:/config
        depends_on:
          - web
    volumes:
      redis_data:
      caddy_data:
      caddy_config:
    COMPOSEEOF
  - chown tenderfish:tenderfish /opt/${project_name}/docker-compose.production.yml

final_message: "TenderFish VPS ready. Docker installed, firewall configured, app directory created."
